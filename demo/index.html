<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>友情来信 · 你需要什么样的友情</title>
<meta name="description" content="用 16 个旅途中的小场景，测一测你需要什么样的友情，再把信寄给朋友，看看你们的契合度。">
<meta property="og:title" content="友情来信 · 你需要什么样的友情">
<meta property="og:description" content="16 个问题测一测，再寄给朋友看看你们的契合度。">
<meta name="theme-color" content="#F4EFE6">
<style>
:root {
  --paper: #F4EFE6;
  --sheet: #FBF8F2;
  --ink: #1F3A5F;
  --ink-soft: #4A5D78;
  --vermilion: #C8452D;
  --brass: #B08A4A;
  --muted: #6B6B6B;
  --rule: #D9D0C1;
  --white: #FFFDF8;
  --f-display: "Noto Serif SC", "Songti SC", "STSong", serif;
  --f-hand: "ZCOOL XiaoWei", "Noto Serif SC", "Kaiti SC", "STKaiti", serif;
  --f-body: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 15px;
  line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px 40px;
  background-image: radial-gradient(rgba(31,58,95,.035) 1px, transparent 1px);
  background-size: 6px 6px;
}
.demo-note { max-width: 420px; margin: 0 auto 12px; font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.demo-note .btn-link { padding: 0; font-size: 12px; }
.demo-note b { color: var(--vermilion); font-weight: 600; letter-spacing: .08em; }
.app { max-width: 420px; margin: 0 auto; position: relative; }
.screen { display: flex; flex-direction: column; gap: 20px; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, .option:focus-visible { outline: 2px solid var(--vermilion); outline-offset: 2px; }
.btn { border: 0; border-radius: 6px; padding: 14px 18px; font-size: 16px; font-weight: 600; letter-spacing: .04em; }
.btn-primary { background: var(--ink); color: var(--white); box-shadow: 0 2px 0 rgba(31,58,95,.25); }
.btn-primary:active { transform: translateY(1px); box-shadow: none; }
.btn-ghost { background: transparent; border: 1px solid var(--rule); color: var(--ink); font-weight: 500; }
.btn-seal { background: var(--vermilion); color: var(--white); }
.btn-link { background: none; border: 0; color: var(--ink-soft); font-size: 14px; padding: 8px; text-decoration: underline; text-underline-offset: 3px; }
.row { display: flex; gap: 12px; }
.row > * { flex: 1; min-width: 0; }

/* ---------- Home: the envelope ---------- */
.envelope { position: relative; background: var(--white); border: 1px solid var(--rule); aspect-ratio: 1.45; max-width: 100%; overflow: hidden; box-shadow: 0 10px 30px -18px rgba(31,58,95,.5); }
.envelope::before { content: ""; position: absolute; inset: 0; background: linear-gradient(to bottom right, transparent 49.6%, var(--rule) 49.8%, transparent 50.2%), linear-gradient(to bottom left, transparent 49.6%, var(--rule) 49.8%, transparent 50.2%); background-size: 100% 62%; background-repeat: no-repeat; }
.envelope .airmail { position: absolute; left: 0; right: 0; bottom: 0; height: 8px; background: repeating-linear-gradient(-45deg, var(--vermilion) 0 10px, var(--white) 10px 20px, var(--ink) 20px 30px, var(--white) 30px 40px); }
.envelope .addr { position: absolute; left: 22px; bottom: 30px; font-family: var(--f-hand); font-size: 22px; line-height: 1.5; color: var(--ink); }
.envelope .addr small { display: block; font-size: 14px; color: var(--muted); font-family: var(--f-body); }
.envelope .stamp-slot { position: absolute; right: 18px; top: 18px; }
.envelope .postmark { position: absolute; right: 64px; top: 46px; }
.home-title { font-family: var(--f-display); font-weight: 700; font-size: 40px; line-height: 1.15; letter-spacing: .08em; margin: 8px 0 0; text-wrap: balance; }
.home-sub { font-family: var(--f-display); font-size: 18px; margin: 4px 0 0; color: var(--ink-soft); }
.home-meta { font-size: 13px; color: var(--muted); letter-spacing: .04em; }
.home-foot { font-size: 12px; color: var(--muted); text-align: center; }
.stamp-row { display: flex; gap: 6px; flex-wrap: wrap; }

/* ---------- Stamps & postmarks ---------- */
.stamp { --s: 76px; width: var(--s); height: calc(var(--s) * 1.22); padding: 6px; background: radial-gradient(circle at 5px 5px, var(--paper) 2.6px, var(--white) 3px) -5px -5px / 10px 10px; flex: none; filter: drop-shadow(0 1px 1px rgba(31,58,95,.15)); }
.stamp .face { width: 100%; height: 100%; background: var(--c); color: var(--white); display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 6px 4px 5px; position: relative; overflow: hidden; }
.stamp .face::after { content: ""; position: absolute; inset: 3px; border: 1px solid rgba(255,253,248,.55); pointer-events: none; }
.stamp svg { width: 62%; height: auto; flex: 1; }
.stamp .val { font-family: var(--f-display); font-size: calc(var(--s) * .12); letter-spacing: .02em; white-space: nowrap; }
.stamp.sm { --s: 40px; padding: 4px; background-size: 8px 8px; background-position: -4px -4px; background-image: radial-gradient(circle at 4px 4px, var(--paper) 2px, var(--white) 2.4px); }
.stamp.sm .val { display: none; }
.stamp.lg { --s: 132px; padding: 9px; background-size: 14px 14px; background-position: -7px -7px; background-image: radial-gradient(circle at 7px 7px, var(--paper) 3.6px, var(--white) 4px); }
.postmark { width: 74px; height: 74px; border: 2px solid var(--vermilion); border-radius: 50%; color: var(--vermilion); display: grid; place-items: center; text-align: center; font-size: 11px; line-height: 1.3; transform: rotate(-12deg); opacity: .88; font-weight: 600; letter-spacing: .04em; }
.postmark::before { content: ""; position: absolute; width: 60px; height: 60px; border: 1px solid var(--vermilion); border-radius: 50%; }
.postmark { position: relative; }

/* ---------- Quiz: postcards ---------- */
.quiz-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.progress { display: grid; grid-template-columns: repeat(8, 14px); gap: 4px; }
.progress i { width: 14px; height: 17px; border: 1px dashed var(--rule); background: transparent; display: block; }
.progress i.on { border: 0; background: var(--c, var(--brass)); box-shadow: 0 0 0 2px var(--white); }
.postcard { background: var(--sheet); border: 1px solid var(--rule); padding: 22px 20px 20px; position: relative; box-shadow: 0 10px 30px -20px rgba(31,58,95,.6); }
.postcard .pm-mini { position: absolute; right: 14px; top: -18px; width: 66px; height: 66px; font-size: 10px; background: var(--sheet); }
.postcard .pm-mini::before { width: 54px; height: 54px; }
.place { font-size: 13px; color: var(--vermilion); letter-spacing: .1em; font-weight: 600; }
.question { font-family: var(--f-display); font-weight: 700; font-size: 24px; line-height: 1.5; margin: 10px 0 18px; text-wrap: balance; padding-right: 48px; }
.options { display: flex; flex-direction: column; }
.option { text-align: left; background: none; border: 0; border-bottom: 1px solid var(--rule); padding: 14px 40px 14px 2px; font-size: 16px; color: var(--ink); position: relative; line-height: 1.5; }
.option:first-child { border-top: 1px solid var(--rule); }
.option .chop { position: absolute; right: 4px; top: 50%; width: 28px; height: 28px; margin-top: -14px; border: 2px solid var(--vermilion); border-radius: 4px; color: var(--vermilion); font-family: var(--f-display); font-size: 14px; display: grid; place-items: center; opacity: 0; transform: scale(1.6) rotate(-8deg); }
.option.picked { color: var(--ink); font-weight: 600; }
.option.picked .chop { opacity: 1; transform: scale(1) rotate(-8deg); transition: transform .12s ease-out, opacity .08s; }
.quiz-foot { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--muted); }
.slide-in { animation: slideIn .26s ease-out; }
@keyframes slideIn { from { transform: translateX(40px); opacity: 0; } to { transform: none; opacity: 1; } }

.interlude { text-align: center; padding: 48px 20px; background: var(--sheet); border: 1px solid var(--rule); display: flex; flex-direction: column; align-items: center; gap: 16px; }
.interlude h2 { font-family: var(--f-hand); font-weight: 400; font-size: 28px; margin: 0; }
.interlude p { margin: 0; color: var(--muted); }

/* ---------- Sealing ---------- */
.sealing { min-height: 420px; display: grid; place-items: center; text-align: center; }
.seal-env { width: 240px; aspect-ratio: 1.45; background: var(--white); border: 1px solid var(--rule); position: relative; margin: 0 auto 24px; box-shadow: 0 10px 30px -18px rgba(31,58,95,.5); }
.seal-env .flap { position: absolute; left: 0; right: 0; top: 0; height: 60%; background: var(--sheet); clip-path: polygon(0 0, 100% 0, 50% 100%); border-bottom: 1px solid var(--rule); transform-origin: top; animation: flapClose .6s .2s ease-in forwards; transform: rotateX(180deg); }
.seal-env .wax { position: absolute; left: 50%; top: 60%; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%; background: var(--vermilion); color: var(--white); display: grid; place-items: center; font-family: var(--f-display); font-size: 18px; transform: scale(0); animation: wax .3s .85s ease-out forwards; box-shadow: inset 0 0 0 4px rgba(0,0,0,.12); }
@keyframes flapClose { to { transform: rotateX(0); } }
@keyframes wax { 60% { transform: scale(1.25); } to { transform: scale(1); } }

/* ---------- Result: the letter ---------- */
.letter { background: var(--sheet); border: 1px solid var(--rule); padding: 26px 22px; display: flex; flex-direction: column; gap: 18px; background-image: linear-gradient(var(--sheet) 31px, rgba(217,208,193,.45) 32px); background-size: 100% 32px; box-shadow: 0 10px 30px -20px rgba(31,58,95,.6); }
.letter .salute { font-size: 14px; color: var(--muted); }
.result-head { display: flex; gap: 18px; align-items: flex-start; }
.result-head .who { min-width: 0; }
.result-type { font-family: var(--f-display); font-weight: 700; font-size: 30px; line-height: 1.2; margin: 2px 0 6px; }
.result-name { font-size: 15px; color: var(--ink-soft); letter-spacing: .1em; }
.verdict { font-family: var(--f-hand); font-size: 24px; line-height: 1.55; margin: 0; color: var(--ink); }
.tags { display: flex; gap: 8px; flex-wrap: wrap; }
.tag { font-size: 12px; border: 1px solid var(--c); color: var(--c); padding: 2px 10px; border-radius: 999px; letter-spacing: .06em; background: var(--white); }
.section-label { font-size: 12px; color: var(--vermilion); letter-spacing: .16em; font-weight: 600; }
.spectra { display: flex; flex-direction: column; gap: 14px; background: var(--white); border: 1px solid var(--rule); padding: 16px 14px; }
.spec-top { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
.spec-top b { color: var(--ink); font-weight: 600; }
.track { position: relative; height: 10px; margin-top: 6px; background: repeating-linear-gradient(90deg, var(--rule) 0 6px, transparent 6px 10px); background-size: 100% 2px; background-repeat: repeat-x; background-position: 0 4px; }
.track .mid { position: absolute; left: 50%; top: 0; width: 1px; height: 10px; background: var(--rule); }
.track .dot { position: absolute; top: -3px; width: 16px; height: 16px; margin-left: -8px; border-radius: 50%; background: var(--vermilion); box-shadow: 0 0 0 3px var(--white); }
.track .dot.b { background: var(--ink); }
.spec-ends { display: flex; justify-content: space-between; font-size: 12px; margin-top: 6px; color: var(--ink-soft); }
.para { margin: 0; font-size: 15px; line-height: 2.13; }
.locked { position: relative; }
.locked .blur { filter: blur(5px); user-select: none; pointer-events: none; }
.unlock-card { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; background: linear-gradient(rgba(251,248,242,.3), rgba(251,248,242,.95) 40%); padding: 16px; }
.unlock-card p { margin: 0; font-size: 13px; color: var(--muted); }
.match-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.match { background: var(--white); border: 1px solid var(--rule); padding: 12px; display: flex; gap: 10px; align-items: center; min-width: 0; }
.match small { display: block; font-size: 11px; color: var(--muted); letter-spacing: .08em; }
.match b { font-family: var(--f-display); font-size: 15px; display: block; }
.match span { font-size: 12px; color: var(--ink-soft); }
.tips { margin: 0; padding-left: 1.3em; display: flex; flex-direction: column; gap: 6px; }
.disclaimer { font-size: 11px; color: var(--muted); text-align: center; }

/* ---------- Invite & pair ---------- */
.sealed { text-align: center; display: flex; flex-direction: column; gap: 14px; align-items: center; }
.sealed .seal-env .flap { animation: none; transform: none; }
.sealed .seal-env .wax { animation: none; transform: none; }
.sealed h2 { font-family: var(--f-display); font-size: 24px; margin: 0; }
.sealed p { margin: 0; color: var(--muted); }
.compat { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.compat .num { font-family: var(--f-display); font-weight: 700; font-size: 72px; line-height: 1; color: var(--vermilion); font-variant-numeric: tabular-nums; }
.compat .num sup { font-size: 24px; }
.compat .tier { font-family: var(--f-hand); font-size: 26px; }
.compat .line { color: var(--ink-soft); font-size: 14px; max-width: 28em; }
.pair-facts { display: flex; flex-direction: column; gap: 10px; }
.fact { background: var(--white); border: 1px solid var(--rule); padding: 12px 14px; }
.fact small { color: var(--vermilion); font-size: 12px; letter-spacing: .1em; font-weight: 600; }
.fact p { margin: 4px 0 0; }

/* ---------- Overlays ---------- */
.overlay { position: fixed; inset: 0; background: rgba(20,28,40,.72); display: grid; place-items: center; z-index: 20; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); overflow-y: auto; }
.sheet { background: var(--sheet); width: 100%; max-width: 380px; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.ad-box { background: #10161F; color: #E8E4DC; aspect-ratio: 16/10; display: grid; place-items: center; text-align: center; font-size: 13px; letter-spacing: .1em; }
.ad-box b { display: block; font-size: 32px; font-variant-numeric: tabular-nums; margin-top: 6px; }
.share-preview { background: var(--white); border: 1px solid var(--rule); border-radius: 6px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.share-preview .t { font-size: 14px; font-weight: 600; }
.share-preview .img { aspect-ratio: 5/4; background: var(--paper); display: grid; place-items: center; }
.share-preview .img .seal-env { width: 70%; margin: 0; }
.share-preview .from { font-size: 11px; color: var(--muted); }
.poster { background: var(--sheet); border: 1px solid var(--rule); padding: 22px 18px; display: flex; flex-direction: column; gap: 14px; aspect-ratio: 3/4; max-width: 100%; position: relative; overflow: hidden; }
.poster .qr { position: absolute; right: 14px; bottom: 14px; width: 64px; height: 64px; font-size: 9px; }
.poster .qr::before { width: 52px; height: 52px; }
.hint { font-size: 12px; color: var(--muted); text-align: center; }
.share-url { width: 100%; font: inherit; font-size: 13px; color: var(--ink-soft); background: var(--white); border: 1px solid var(--rule); border-radius: 6px; padding: 10px 12px; }
.poster .ps-radar { width: 100%; height: auto; }
.poster { aspect-ratio: auto; }
.poster-foot { font-size: 12px; color: var(--muted); text-align: center; letter-spacing: .1em; }
/* ---------- 友情人格维度 ---------- */
.ps { display: flex; flex-direction: column; }
.ps-radar { width: 100%; height: auto; display: block; font-family: var(--f-display); }
.ps-note { text-align: center; font-size: 11px; color: var(--muted); letter-spacing: .06em; }
.ps-bars { margin-top: 16px; background: var(--white); border: 1px solid var(--rule); padding: 4px 16px; }
.ps-bar-row { padding: 12px 0; border-bottom: 1px dashed var(--rule); }
.ps-bar-row:last-child { border-bottom: 0; }
.ps-bar-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.ps-name { font-size: 14px; font-weight: 600; letter-spacing: .1em; }
.ps-level { font-size: 12px; color: var(--vermilion); }
.ps-bar { position: relative; height: 7px; margin: 10px 0 7px; background: #E6DED0; border-radius: 7px; overflow: hidden; }
.ps-bar-fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--ink); }
.ps-bar-mid { position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; background: var(--sheet); }
.ps-bar-ends { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
.ps-on { color: var(--ink); font-weight: 600; }
.ps-read { padding-top: 16px; }
.ps-read-head { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
.ps-read-name { font-family: var(--f-display); font-size: 16px; font-weight: 700; }
.ps-chip { font-size: 11px; color: var(--vermilion); border: 1px solid var(--vermilion); border-radius: 3px; padding: 0 6px; }
.ps-read-text { margin: 0; font-size: 14px; line-height: 1.9; color: var(--ink-soft); }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } .seal-env .flap { transform: none; } .seal-env .wax { transform: none; } }
</style>
</head>

/* ---------- scoring (same logic as core/scoring.ts) ---------- */
function axisScores(answers) { const s = [0,0,0,0]; answers.forEach(a => { if (a) s[a.axis] += a.value; }); return s; }
function matchGuest(answers) {
  const s = axisScores(answers), strong = [0,0,0,0], last = [-1,-1,-1,-1];
  answers.forEach(a => { if (!a) return; if (Math.abs(a.value) === 2) strong[a.axis]++; last[a.axis] = Math.max(last[a.axis], a.q); });
  const order = [0,1,2,3].sort((x, y) => Math.abs(s[y]) - Math.abs(s[x]) || strong[y] - strong[x] || last[y] - last[x]);
  const side = (ax, same) => C.poles[ax][(s[ax] >= 0) === same ? 0 : 1];
  return { scores: s, guest: side(order[0], true), healer: side(order[1], true), friction: side(order[0], false) };
}
function compat(a, b) {
  const gaps = a.map((v, i) => Math.abs(v - b[i]));
  const score = Math.round(100 - gaps.reduce((t, g) => t + g, 0) / 64 * 100);
  const tier = C.tiers.find(t => score >= t.min);
  return { score, tier, gaps, closestAxis: gaps.indexOf(Math.min(...gaps)), farthestAxis: gaps.indexOf(Math.max(...gaps)) };
}

/* ---------- share links: no server, the four scores ride in the URL ----------
   ?i=CODE  a sealed letter from a friend (their scores; the page never shows their guest)
   ?p=CODE  a reply carrying both people's scores, so the sender sees the same 契合度 */
const ALPHA = 'k3m9qx7bf2wtz5hnp'; // 17 symbols for -8..8
function encScores(s) {
  const body = s.map((v, i) => ALPHA[(Math.max(-8, Math.min(8, v)) + 8 + i * 5) % 17]).join('');
  const sum = s.reduce((t, v, i) => t + (v + 8) * (i + 3), 0);
  return body + ALPHA[sum % 17];
}
function decScores(code) {
  if (!code || code.length !== 5) return null;
  const s = [];
  for (let i = 0; i < 4; i++) {
    const k = ALPHA.indexOf(code[i]);
    if (k < 0) return null;
    s.push(((k - i * 5) % 17 + 17) % 17 - 8);
  }
  return encScores(s) === code ? s : null;
}
function baseUrl() { return location.origin + location.pathname; }
function inviteUrl(scores) { return `${baseUrl()}?i=${encScores(scores)}`; }
function replyUrl(owner, friend) { return `${baseUrl()}?p=${encScores(owner)}${encScores(friend)}`; }
function resultFromScores(scores) {
  // 只有分数时也能还原结果：用分数构造一组等价答案
  const answers = [];
  scores.forEach((v, axis) => { let left = v; for (let k = 0; k < 4; k++) { const step = Math.max(-2, Math.min(2, left)) || 1; answers.push({ q: answers.length, axis, value: step }); left -= step; } });
  return matchGuest(answers);
}

function loadMe() { try { const r = JSON.parse(localStorage.getItem(STORE_KEY)); return r && r.scores && C.guests[r.guest] ? r : null; } catch (e) { return null; } }

function toDims(scores) {
  return C.axes.map((ax, i) => {
    const s = Math.max(-8, Math.min(8, scores[i] || 0));
    const posPct = Math.round((s + 8) / 16 * 100), negPct = 100 - posPct;
    const lead = Math.abs(s) <= 1 ? 'mid' : s > 0 ? 'pos' : 'neg';
    const leadWord = lead === 'pos' ? ax.pos : lead === 'neg' ? ax.neg : '均衡';
    const abs = Math.abs(s);
    return {
      name: ax.name, posWord: ax.pos, negWord: ax.neg, posPct, negPct, lead, leadWord,
      leadPct: lead === 'mid' ? Math.max(posPct, negPct) : lead === 'neg' ? negPct : posPct,
      strength: abs / 8,
      levelText: lead === 'mid' ? '两端很均衡' : `${abs >= 5 ? '明显' : '略微'}偏向「${leadWord}」`,
      text: READINGS[i][lead === 'pos' ? 0 : lead === 'neg' ? 1 : 2],
    };
  });
}
function radarSVG(dims) {
  const W = 340, H = 290, cx = W / 2, cy = H / 2 + 4, r = 84;
  const ang = [-Math.PI / 2, 0, Math.PI / 2, Math.PI];
  const pt = (k, f) => [cx + Math.cos(ang[k]) * r * f, cy + Math.sin(ang[k]) * r * f];
  const poly = f => [0,1,2,3].map(k => pt(k, typeof f === 'function' ? f(k) : f).map(n => n.toFixed(1)).join(',')).join(' ');
  const grid = [0.25, 0.5, 0.75, 1].map((f, gi) => `<polygon points="${poly(f)}" fill="none" stroke="#D9D0C1" ${gi < 3 ? 'stroke-dasharray="4 4"' : ''}/>`).join('');
  const spokes = [0,1,2,3].map(k => { const [x, y] = pt(k, 1); return `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#D9D0C1"/>`; }).join('');
  const vals = dims.map(d => 0.14 + 0.86 * d.strength);
  const dots = vals.map((v, k) => { const [x, y] = pt(k, v); return `<circle cx="${x}" cy="${y}" r="4" fill="#C8452D"/>`; }).join('');
  const gap = 14;
  const lab = [
    { x: cx, y: cy - r - gap - 20, a: 'middle' }, { x: cx + r + gap, y: cy - 8, a: 'start' },
    { x: cx, y: cy + r + gap + 12, a: 'middle' }, { x: cx - r - gap, y: cy - 8, a: 'end' },
  ];
  const labels = dims.map((d, k) => { const L = lab[k];
    return `<text x="${L.x}" y="${L.y}" text-anchor="${L.a}" fill="#1F3A5F" font-weight="700" font-size="15">${esc(d.name)}</text>
      <text x="${L.x}" y="${L.y + 20}" text-anchor="${L.a}" fill="${d.lead === 'mid' ? '#6B6B6B' : '#C8452D'}" font-size="13">${esc(d.lead === 'mid' ? '两端均衡' : d.leadWord + ' ' + d.leadPct + '%')}</text>`; }).join('');
  return `<svg class="ps-radar" viewBox="0 0 ${W} ${H}" role="img" aria-label="友情人格维度雷达图">${grid}${spokes}
    <polygon points="${poly(k => vals[k])}" fill="rgba(200,69,45,.16)" stroke="#C8452D" stroke-width="2"/>${dots}${labels}</svg>`;
}
function persona(scores, opts) {
  const dims = toDims(scores);
  const bars = `<div class="ps-bars">${dims.map(d => `<div class="ps-bar-row">
      <div class="ps-bar-head"><span class="ps-name">${esc(d.name)}</span><span class="ps-level">${esc(d.levelText)}</span></div>
      <div class="ps-bar"><div class="ps-bar-fill" style="width:${d.posPct}%"></div><div class="ps-bar-mid"></div></div>
      <div class="ps-bar-ends"><span class="${d.lead === 'pos' ? 'ps-on' : ''}">${esc(d.posWord)} ${d.posPct}%</span><span class="${d.lead === 'neg' ? 'ps-on' : ''}">${d.negPct}% ${esc(d.negWord)}</span></div>
    </div>`).join('')}</div>`;
  const reads = `<div class="ps-reads">${dims.map(d => `<div class="ps-read"><div class="ps-read-head"><span class="ps-read-name">${esc(d.name)}</span><span class="ps-chip">${esc(d.leadWord)}</span></div><p class="ps-read-text">${esc(d.text)}</p></div>`).join('')}</div>`;
  return `<div class="ps">${radarSVG(dims)}<div class="ps-note">离中心越远，这一维的倾向越鲜明</div>${bars}${opts && opts.short ? '' : reads}</div>`;
}

/* ---------- pieces ---------- */
function stamp(id, size) {
  const g = C.guests[id];
  return `<div class="stamp ${size || ''}" style="--c:${g.color}" aria-hidden="true"><div class="face"><svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">${ICONS[g.icon]}</svg><span class="val">${esc(g.type)}</span></div></div>`;
}
function sealedEnvelope() { return `<div class="seal-env"><div class="flap"></div><div class="wax">信</div></div>`; }
const FOOT = '<p class="disclaimer">趣味测试 · 非官方出品 · 角色解读基于节目公开内容</p>';

/* ---------- screens ---------- */
function renderHome() {
  history.replaceState(null, '', baseUrl());
  const ids = Object.keys(C.guests);
  const saved = loadMe();
  app.innerHTML = `<section class="screen slide-in">
    <div class="envelope"><div class="stamp-slot">${stamp('xufei','sm')}</div><div class="postmark">友情来信<br>寄 出</div>
      <div class="addr"><small>寄给</small>需要友情的你</div><div class="airmail"></div></div>
    <div><h1 class="home-title">友情来信</h1><p class="home-sub">寄给朋友的一封信 · 你需要什么样的友情</p></div>
    <div class="home-meta">16 站旅途情境 · 8 枚嘉宾邮票 · 约 3 分钟</div>
    <div class="stamp-row" aria-label="8 位嘉宾">${ids.map(id => stamp(id, 'sm')).join('')}</div>
    <button class="btn btn-primary" id="start-btn" type="button">拆开信封，开始测试</button>
    ${saved ? '<button class="btn btn-ghost" type="button" id="saved-btn">查看我上次的结果</button>' : ''}
    ${FOOT}
  </section>`;
  document.getElementById('start-btn').onclick = () => { S = freshState(); renderQuiz(); };
  const sb = document.getElementById('saved-btn');
  if (sb) sb.onclick = () => { S = freshState(); S.me = saved; renderResult(); };
}

function renderQuiz() {
  const i = S.q;
  if (i > 0 && i % 4 === 0 && !S.interludeShown[i]) return renderInterlude(i);
  const q = C.questions[i];
  const order = ORDERS[i % 4];
  const picked = S.answers[i];
  const cells = C.questions.map((_, k) => {
    const a = S.answers[k];
    const color = a ? C.guests[C.poles[a.axis][a.value > 0 ? 0 : 1]].color : '';
    return `<i class="${a ? 'on' : ''}" style="${a ? `--c:${color}` : ''}"></i>`;
  }).join('');
  app.innerHTML = `<section class="screen">
    <div class="quiz-top"><div class="progress" aria-label="进度 ${i + 1}/16">${cells}</div><span class="home-meta">${S.mode === 'friend' ? '回信中 · ' : ''}${i + 1} / 16</span></div>
    <article class="postcard slide-in">
      <div class="postmark pm-mini">第 ${i + 1} 站<br>${esc(q.place.split(' · ')[0])}</div>
      <div class="place">${esc(q.place)}</div>
      <h2 class="question">${esc(q.text)}</h2>
      <div class="options" role="list">${order.map((oi, k) => {
        const o = q.options[oi];
        const on = picked && picked.value === o.value;
        return `<button type="button" class="option ${on ? 'picked' : ''}" data-v="${o.value}">${esc(o.text)}<span class="chop">${CHOPS[k]}</span></button>`;
      }).join('')}</div>
    </article>
    <div class="quiz-foot"><button class="btn-link" type="button" id="prev-btn" ${i === 0 ? 'disabled style="visibility:hidden"' : ''}>← 上一站</button><span>选好后自动前往下一站</span></div>
  </section>`;
  window.scrollTo(0, 0);
  app.querySelectorAll('.option').forEach(btn => btn.onclick = () => {
    app.querySelectorAll('.option').forEach(b => b.classList.remove('picked'));
    btn.classList.add('picked');
    if (navigator.vibrate) { try { navigator.vibrate(12); } catch (e) {} }
    S.answers[i] = { q: i, axis: q.axis, value: Number(btn.dataset.v) };
    setTimeout(() => { if (S.q === i) { if (i === 15) finishQuiz(); else { S.q++; renderQuiz(); } } }, 320);
  });
  document.getElementById('prev-btn').onclick = () => { if (S.q > 0) { S.q--; renderQuiz(); } };
}
function renderInterlude(i) {
  const lines = { 4: ['第一封信已寄出', '你已经走过 4 站，路还长'], 8: ['旅途过半', '风景换了，同行的人还在'], 12: ['快到终点了', '最后 4 站，想想你最在意的那个人'] };
  const [h, p] = lines[i];
  app.innerHTML = `<section class="screen"><div class="interlude slide-in"><div class="postmark">第 ${i} 站<br>已盖章</div><h2>${h}</h2><p>${p}</p><button class="btn btn-primary" type="button" id="go-on">继续出发</button></div></section>`;
  document.getElementById('go-on').onclick = () => { S.interludeShown[i] = true; renderQuiz(); };
}
function finishQuiz() {
  app.innerHTML = `<section class="screen sealing"><div>${sealedEnvelope()}<p class="home-meta">正在封缄你的信…</p></div></section>`;
  const result = matchGuest(S.answers);
  saveMe(result);
  setTimeout(() => {
    if (S.mode === 'friend') { S.friend = result; S.pair = compat(S.owner, result.scores); renderPair(); }
    else { S.me = result; renderResult(); }
  }, 1500);
}

function guestHead(id, size) {
  const g = C.guests[id];
  return `<div class="result-head">${stamp(id, size)}<div class="who"><div class="result-type">${esc(g.type)}</div><div class="result-name">${esc(g.name)} · ${esc(g.group)}</div></div></div>`;
}
function renderResult() {
  history.replaceState(null, '', baseUrl());
  const r = S.me, g = C.guests[r.guest], healer = C.guests[r.healer], friction = C.guests[r.friction];
  app.innerHTML = `<section class="screen slide-in">
    <article class="letter" style="--c:${g.color}">
      <div class="salute">见字如面。你需要的友情是——</div>
      ${guestHead(r.guest, 'lg')}
      <p class="verdict">${esc(g.verdict)}</p>
      <div class="tags">${g.keywords.map(k => `<span class="tag">${esc(k)}</span>`).join('')}</div>
      <div class="section-label">你的友情人格维度</div>
      ${persona(r.scores)}
      <div class="section-label">你需要的友情说明书</div>
      <p class="para">${esc(g.need)}</p>
      <div class="section-label">你的友情盲点</div><p class="para">${esc(g.blind)}</p>
      <div class="section-label">朋友匹配</div>
      <div class="match-grid">
        <div class="match">${stamp(r.healer,'sm')}<div><small>治愈你的朋友</small><b>${esc(healer.type)}</b><span>${esc(healer.name)}式</span></div></div>
        <div class="match">${stamp(r.friction,'sm')}<div><small>最需磨合的朋友</small><b>${esc(friction.type)}</b><span>${esc(friction.name)}式</span></div></div>
      </div>
      <div class="section-label">给你的相处建议</div><ol class="tips">${g.tips.map(t => `<li>${esc(t)}</li>`).join('')}</ol>
    </article>
    <button class="btn btn-primary" type="button" id="share-btn">寄给你的朋友，测测你们的契合度</button>
    <div class="row"><button class="btn btn-ghost" type="button" id="poster-btn">生成结果卡片</button><button class="btn btn-ghost" type="button" id="again-btn">再测一次</button></div>
    ${FOOT}
  </section>`;
  window.scrollTo(0, 0);
  document.getElementById('share-btn').onclick = () => showShare(inviteUrl(r.scores), '我给你寄了一封信，拆开前先回答 16 个问题', '链接里只有封着的信封。朋友答完能看到你们的契合度，但看不到你是哪位嘉宾。');
  document.getElementById('poster-btn').onclick = showPoster;
  document.getElementById('again-btn').onclick = () => { S = freshState(); renderQuiz(); };
}

function renderInvite() {
  app.innerHTML = `<section class="screen slide-in"><div class="sealed">
    ${sealedEnvelope()}
    <h2>来自朋友的一封信</h2>
    <p>信已封缄。回答 16 个问题，就能拆开它，看看你们的契合度。</p>
    <p class="home-meta">你看不到对方是哪位嘉宾，对方也看不到你的。</p>
    <button class="btn btn-primary" type="button" id="reply-btn" style="width:100%">开始回信</button>
    <button class="btn-link" type="button" id="own-btn">我只想自己测一测</button>
  </div></section>`;
  document.getElementById('reply-btn').onclick = () => { S.q = 0; S.answers = []; S.interludeShown = {}; renderQuiz(); };
  document.getElementById('own-btn').onclick = () => { S = freshState(); renderHome(); };
}

function pairLetter(p, a, b, salute) {
  const near = C.axes[p.closestAxis], far = C.axes[p.farthestAxis];
  return `<article class="letter">
      <div class="salute">${salute}</div>
      <div class="compat"><div class="num">${p.score}<sup>%</sup></div><div class="tier">${esc(p.tier.name)}</div><div class="line">${esc(p.tier.line)}</div></div>
      <div class="pair-facts">
        <div class="fact"><small>最同频</small><p>你们在「${near.name}」上最合拍。</p></div>
        <div class="fact"><small>最不同</small><p>你们在「${far.name}」上差得最远：${esc(far.gap)}。</p></div>
      </div>
      <div class="section-label">关系深度解读</div>
      <div class="pair-facts">${C.axes.map((ax, i) => {
        const d = Math.abs(a[i] - b[i]);
        const level = d <= 3 ? '很同频' : d <= 7 ? '有些不同' : '差得很远';
        return `<div class="fact"><small>${ax.name} · ${level}</small><p>${d <= 3 ? '这件事上你们不用多解释。' : esc(ax.gap) + '。提前说好各自的习惯，会少很多误会。'}</p></div>`;
      }).join('')}</div>
    </article>`;
}
function renderPair() {
  history.replaceState(null, '', baseUrl());
  const p = S.pair, me = S.friend, g = C.guests[me.guest];
  app.innerHTML = `<section class="screen slide-in">
    ${pairLetter(p, S.owner, me.scores, '信拆开了。你们的友情契合度是——')}
    <button class="btn btn-seal" type="button" id="back-btn">把这封回信寄回给 TA</button>
    <p class="hint">TA 打开回信链接，会看到同样的契合度。双方都看不到对方的嘉宾。</p>
    <article class="letter" style="--c:${g.color}">
      <div class="salute">另附：你自己的结果</div>
      ${guestHead(me.guest)}
      <p class="verdict" style="font-size:20px">${esc(g.verdict)}</p>
      ${persona(me.scores, { short: true })}
    </article>
    <button class="btn btn-primary" type="button" id="see-full">查看我的完整结果</button>
    <button class="btn btn-ghost" type="button" id="own-share">也寄一封信给别的朋友</button>
    ${FOOT}
  </section>`;
  window.scrollTo(0, 0);
  document.getElementById('back-btn').onclick = () => showShare(replyUrl(S.owner, me.scores), '朋友给你回信了，打开看看你们的契合度', '回信里只有你们的契合度，不会透露各自是哪位嘉宾。');
  const toSelf = () => { S.me = S.friend; S.mode = 'self'; renderResult(); };
  document.getElementById('see-full').onclick = toSelf;
  document.getElementById('own-share').onclick = () => { toSelf(); showShare(inviteUrl(me.scores), '我给你寄了一封信，拆开前先回答 16 个问题', '链接里只有封着的信封。朋友答完能看到你们的契合度，但看不到你是哪位嘉宾。'); };
}
function renderReply(owner, friend) {
  const p = compat(owner, friend);
  const saved = loadMe();
  app.innerHTML = `<section class="screen slide-in">
    <div class="sealed">${sealedEnvelope()}<h2>朋友给你回信了</h2></div>
    ${pairLetter(p, owner, friend, '你们的友情契合度是——')}
    ${saved ? '<button class="btn btn-ghost" type="button" id="mine-btn">查看我的完整结果</button>' : ''}
    <button class="btn btn-primary" type="button" id="home-btn">再寄一封信给别的朋友</button>
    ${FOOT}
  </section>`;
  const mb = document.getElementById('mine-btn');
  if (mb) mb.onclick = () => { S = freshState(); S.me = saved; renderResult(); };
  document.getElementById('home-btn').onclick = () => {
    if (saved) { S = freshState(); S.me = saved; renderResult(); }
    else { S = freshState(); S.me = resultFromScores(owner); saveMe(S.me); renderResult(); }
  };
}

/* ---------- overlays ---------- */
function openOverlay(html) {
  overlayRoot.innerHTML = `<div class="overlay" role="dialog" aria-modal="true"><div class="sheet">${html}</div></div>`;
  const ov = overlayRoot.firstElementChild;
  ov.addEventListener('click', e => { if (e.target === ov) closeOverlay(); });
  return ov;
}
function closeOverlay() { overlayRoot.innerHTML = ''; }
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch (e) {}
  const ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  let ok = false; try { ok = document.execCommand('copy'); } catch (e) {}
  ta.remove(); return ok;
}
function showShare(url, title, note) {
  const text = `${title} ${url}`;
  const ov = openOverlay(`<div class="section-label">寄出这封信</div>
    <div class="share-preview"><div class="t">${esc(title)}</div><div class="img">${sealedEnvelope()}</div><div class="from">友情来信 · 网页版</div></div>
    <input class="share-url" id="share-url" readonly value="${esc(url)}" aria-label="分享链接">
    <button class="btn btn-primary" type="button" id="copy-btn">复制链接，发给朋友</button>
    ${navigator.share ? '<button class="btn btn-ghost" type="button" id="native-share">用系统分享</button>' : ''}
    <p class="hint">${esc(note)}</p>
    <button class="btn-link" type="button" id="share-close">关闭</button>`);
  const input = ov.querySelector('#share-url');
  input.onclick = () => input.select();
  ov.querySelector('#copy-btn').onclick = async e => {
    const ok = await copyText(text);
    e.target.textContent = ok ? '已复制，去微信粘贴给朋友吧' : '复制失败，请长按上面的链接手动复制';
    if (!ok) input.select();
  };
  const ns = ov.querySelector('#native-share');
  if (ns) ns.onclick = () => navigator.share({ title, text: title, url }).catch(() => {});
  ov.querySelector('#share-close').onclick = closeOverlay;
}
function showPoster() {
  const r = S.me, g = C.guests[r.guest];
  const ov = openOverlay(`<div class="poster" style="--c:${g.color}">
      <div class="salute" style="font-size:12px;color:var(--muted)">我需要的友情是——</div>
      <div class="result-head">${stamp(r.guest)}<div class="who"><div class="result-type" style="font-size:22px">${esc(g.type)}</div><div class="result-name">${esc(g.name)}</div></div></div>
      <p class="verdict" style="font-size:19px">${esc(g.verdict)}</p>
      <div class="tags">${g.keywords.map(k => `<span class="tag">${esc(k)}</span>`).join('')}</div>
      ${radarSVG(toDims(r.scores))}
      <div class="poster-foot">友情来信 · 你需要什么样的友情</div>
    </div>
    <p class="hint">截图这张卡片，就能发朋友圈或保存。</p>
    <button class="btn btn-ghost" type="button" id="poster-close">关闭</button>`);
  ov.querySelector('#poster-close').onclick = closeOverlay;
}

document.getElementById('reset-btn').onclick = () => { closeOverlay(); S = freshState(); renderHome(); };

(function route() {
  const qs = new URLSearchParams(location.search);
  const inv = decScores(qs.get('i'));
  const rep = qs.get('p');
  if (inv) { S = freshState(); S.owner = inv; S.mode = 'friend'; return renderInvite(); }
  if (rep && rep.length === 10) {
    const a = decScores(rep.slice(0, 5)), b = decScores(rep.slice(5));
    if (a && b) return renderReply(a, b);
  }
  renderHome();
})();
</script>
